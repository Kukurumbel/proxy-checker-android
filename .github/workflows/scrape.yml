name: Update proxies

# Сервер GitHub собирает свежие прокси и коммитит proxies.json.
# Телефон потом качает этот файл с GitHub без VPN.
on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:           # и вручную кнопкой

permissions:
  contents: write

# Не запускать новый сбор, если предыдущий ещё идёт
concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect proxies
        run: python scrape.py

      # Проверяем собранные прокси на чистом интернете сервера и оставляем
      # только реально доступные → working_proxies.json (его качает телефон).
      - name: Verify proxies
        run: python verify.py

      - name: Commit if changed
        run: |
          git config user.name "proxy-bot"
          git config user.email "proxy-bot@users.noreply.github.com"
          git add proxies.json working_proxies.json
          if ! git diff --cached --quiet; then
            git commit -m "Update proxies ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
            echo "списки обновлены"
          else
            echo "изменений нет"
          fi
