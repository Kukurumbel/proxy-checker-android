name: Probe (one-off test)

# Разовая проверка гипотезы: видит ли сервер GitHub прокси рабочими.
# Ничего не коммитит — только печатает статистику в лог.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape fresh list
        run: python scrape.py
      - name: Verify against Telegram
        run: python verify.py
      - name: Show result
        run: |
          echo "===== working_proxies.json (первые строки) ====="
          head -c 600 working_proxies.json || true
          echo ""
          echo "===== ИТОГ ====="
          python -c "import json; d=json.load(open('working_proxies.json')); print('Рабочих:', d['count'], 'из', d['checked'])"
